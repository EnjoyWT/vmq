name: vmq

services:
  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${VMQ_BIND_ADDRESS:-0.0.0.0}:${VMQ_HTTP_PORT:-18473}:80"
    environment:
      APP_DEBUG: "false"
      VMQ_DB_HOST: db
      VMQ_DB_PORT: "3306"
      VMQ_DB_NAME: vmq
      VMQ_DB_USER: vmq
      VMQ_DB_PASSWORD: "${VMQ_DB_PASSWORD:?请先复制 .env.example 为 .env 并设置数据库密码}"
      VMQ_ADMIN_PASSWORD: "${VMQ_ADMIN_PASSWORD:?请设置后台管理员密码}"
      VMQ_API_KEY: "${VMQ_API_KEY:?请设置 APP 通讯密钥}"
      VMQ_NOTIFY_URL: "${VMQ_NOTIFY_URL:-}"
      VMQ_RETURN_URL: "${VMQ_RETURN_URL:-}"
      VMQ_COOKIE_SECURE: "${VMQ_COOKIE_SECURE:-false}"
      VMQ_ALLOW_ORDER_CALLBACK_OVERRIDE: "${VMQ_ALLOW_ORDER_CALLBACK_OVERRIDE:-false}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - vmq_runtime:/var/www/html/runtime
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: vmq
      MARIADB_USER: vmq
      MARIADB_PASSWORD: "${VMQ_DB_PASSWORD:?请设置数据库密码}"
      MARIADB_ROOT_PASSWORD: "${VMQ_DB_ROOT_PASSWORD:?请设置数据库 root 密码}"
      TZ: Asia/Shanghai
    volumes:
      - vmq_db_data:/var/lib/mysql
      - ./v.sql:/docker-entrypoint-initdb.d/001-vmq.sql:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vmq_db_data:
  vmq_runtime:
