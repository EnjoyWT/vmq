<style>
    .layui-table-cell {
        height: auto;
    }

    .layui-table img {
        max-width: 200px;
    }
</style>
<table id="demo" lay-filter="test"></table>

<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script>
    function formatDate(now) {
        now = new Date(now * 1000);
        return now.getFullYear()
            + "-" + (now.getMonth() > 8 ? (now.getMonth() + 1) : "0" + (now.getMonth() + 1))
            + "-" + (now.getDate() > 9 ? now.getDate() : "0" + now.getDate())
            + " " + (now.getHours() > 9 ? now.getHours() : "0" + now.getHours())
            + ":" + (now.getMinutes() > 9 ? now.getMinutes() : "0" + now.getMinutes())
            + ":" + (now.getSeconds() > 9 ? now.getSeconds() : "0" + now.getSeconds());

    }
    var myTable, table, form;
    layui.use(['form', 'table', 'laydate'], function () {
        table = layui.table;
        form = layui.form;

        myTable = table.render({
            elem: '#demo'
            , height: 'full-130'
            , url: 'admin/index/getPayQrcodes'
            , where: {
                type: 2,
            }
            , cols: [[
                {
                    field: 'state', title: '二维码', templet: function (d) {
                        return '<img src="enQrcode?url=' + encodeURIComponent(d.pay_url) + '"/>';
                    }
                },
                { field: 'price', title: '金额' },
                { title: "操作", width: 70, align: 'center', toolbar: '#barDemo' }

            ]]
            , page: true
        });

        table.on('tool(test)', function (obj) {
            var data = obj.data
                , layEvent = obj.event;
            if (layEvent === 'del') {
                layer.confirm('要删除该二维码么？', function (index) {

                    layer.close(index);
                    $.post("admin/index/delPayQrcode", "id=" + data.id, function (data) {
                        if (data.code == 1) {
                            obj.del();
                        }

                        layer.msg(data.msg);
                    });
                });
            }
        });

        form.render();

    });

</script>
